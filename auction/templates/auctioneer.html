{% extends 'base.html' %}
 
{% block content %}
<div class="container">
 
<h2>Auctioneer Dashboard</h2>
 
<div class="grid">
{% for item in items %}
 
<div class="card">
<h3>{{ item.name }}</h3>
<p>{{ item.description }}</p>
<p>Status: {{ item.status }}</p>
 
    {% if item.status == 'pending' %}
<a href="{% url 'approve' item.id %}" class="btn btn-green">Approve</a>
    {% endif %}
 
    <a href="{% url 'winner' item.id %}" class="btn">Declare Winner</a>
</div>
 
{% endfor %}
</div>
 
</div>
{% endblock %}
