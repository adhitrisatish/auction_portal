
{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>Secure Checkout</h1>

    <h2>{{ item.name }}</h2>
    <p>Winning amount: <strong>₹{{ amount|floatformat:2 }}</strong></p>

    <p>This is a simulated payment for your project.</p>

    <form method="POST"
          action="{% url 'process_payment' item.id %}">
        {% csrf_token %}

        <label for="payment_method">Payment method</label>
        <select name="payment_method" id="payment_method" required>
            <option value="upi">UPI (Simulated)</option>
            <option value="card">Card (Simulated)</option>
            <option value="netbanking">Net Banking (Simulated)</option>
        </select>

        <br><br>

        <label for="outcome">Test payment outcome</label>
        <select name="outcome" id="outcome" required>
            <option value="success">Simulate Success</option>
            <option value="failed">Simulate Failure</option>
        </select>

        <br><br>

        <button type="submit">Pay ₹{{ amount|floatformat:2 }}</button>
    </form>
</div>
{% endblock %}
